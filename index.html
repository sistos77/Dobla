<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DOBLA - Trova Prodotto</title>
  
  <!-- Configurazione PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3D2314">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    :root {
      --bg-color: #F4EBE1;       /* Beige chiaro */
      --primary: #3D2314;        /* Marrone Nutella */
      --accent: #8DA750;         /* Verde pistacchio */
      --text-dark: #2A180D;
      --card-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary);
      font-size: 28px;
      letter-spacing: 1px;
    }

    .search-box {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 2px solid var(--primary);
      border-radius: 12px;
      outline: none;
      margin-bottom: 15px;
      background: #FFF;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      background-color: var(--primary);
      color: #FFF;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .btn-secondary {
      background-color: var(--accent);
    }

    #fileInput {
      display: none;
    }

    .results-list {
      list-style: none;
    }

    .item-card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border-left: 5px solid var(--accent);
    }

    .item-title {
      font-weight: bold;
      font-size: 16px;
      color: var(--primary);
    }

    .item-details {
      font-size: 14px;
      margin-top: 4px;
      color: #555;
    }

    .location-tag {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 8px;
      background: var(--bg-color);
      color: var(--primary);
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <h1>DOBLA</h1>
  </header>

  <input type="text" id="searchInput" class="search-box" placeholder="Cerca prodotto o codice..." oninput="filterProducts()">

  <div class="controls">
    <button class="btn" onclick="document.getElementById('fileInput').click()">Carica CSV</button>
    <button class="btn btn-secondary" onclick="exportData()">Backup</button>
    <input type="file" id="fileInput" accept=".csv" onchange="importCSV(event)">
  </div>

  <ul id="resultsList" class="results-list"></ul>

  <script>
    let products = JSON.parse(localStorage.getItem('dobla_products') || '[]');

    function renderProducts(list) {
      const container = document.getElementById('resultsList');
      container.innerHTML = '';
      list.forEach(p => {
        const li = document.createElement('li');
        li.className = 'item-card';
        li.innerHTML = `
          <div class="item-title">${p.nome}</div>
          <div class="item-details">Cod. Produttore: <strong>${p.codice || '-'}</strong></div>
          <div class="location-tag">Scaffale: ${p.scaffale} | Ripiano: ${p.ripiano}</div>
        `;
        container.appendChild(li);
      });
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toUpperCase();
      const filtered = products.filter(p => 
        p.nome.toUpperCase().includes(query) || 
        (p.codice && p.codice.toUpperCase().includes(query))
      );
      renderProducts(filtered);
    }

    function importCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const lines = e.target.result.split('\n');
        products = [];
        lines.forEach(line => {
          const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
          if (cols.length >= 4 && cols[0]) {
            products.push({
              nome: cols[0].toUpperCase(),
              codice: cols[1],
              scaffale: cols[2],
              ripiano: cols[3]
            });
          }
        });
        localStorage.setItem('dobla_products', JSON.stringify(products));
        renderProducts(products);
        alert('Dati aggiornati con successo!');
      };
      reader.readAsText(file);
    }

    function exportData() {
      if (products.length === 0) return alert('Nessun dato da esportare.');
      let csvContent = "data:text/csv;charset=utf-8,";
      products.forEach(p => {
        csvContent += `"${p.nome}","${p.codice}","${p.scaffale}","${p.ripiano}"\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "dobla_backup.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Caricamento iniziale
    renderProducts(products);

    // SYSTEM UPDATE: Auto-refresh via Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed') {
                  if (navigator.serviceWorker.controller) {
                    // Ricarica automatica dell'app quando rileva una nuova versione
                    window.location.reload();
                  }
                }
              };
            };
          });
      });
    }
  </script>
</body>
</html>
